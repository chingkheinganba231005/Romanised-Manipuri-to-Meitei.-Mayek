<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Meitei Mayek Transliterator</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Meetei+Mayek:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Meitei Mayek Transliterator</h1>

      <p class="subtitle">
        Convert Romanised Manipuri or English-style names into Meitei Mayek script in real time.
      </p>

      <label for="inputText">Enter Romanised word or sentence</label>

      <textarea
        id="inputText"
        placeholder="eshing, chingkhei"
      ></textarea>

      <div class="output-box">
        <h2>Output</h2>
        <p id="outputText"></p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
